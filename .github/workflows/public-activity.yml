name: Refresh public repository activity

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/update_public_activity.py
      - .github/workflows/public-activity.yml

permissions:
  contents: write

concurrency:
  group: public-repository-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Refresh public repositories
        run: python3 scripts/update_public_activity.py
      - name: Commit only if the section changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/public-activity.svg assets/public-activity-mobile.svg
          if git diff --cached --quiet; then
            echo 'No public data changed.'
          else
            git commit -m 'chore: refresh public repository activity'
            git pull --rebase
            git push
          fi
